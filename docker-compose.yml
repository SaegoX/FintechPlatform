services:
  loan-service-api:
    image: fintech-loanservice:latest
    build:
      context: .
      dockerfile: LoanService.API/Dockerfile
    ports:
      - "7109:8080"
    environment:
      - ConnectionStrings__PostgresConnection=${LOAN_DB_CONNECTION_STRING}
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      loan_db:
        condition: service_healthy

  loan_db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_LOAN_DB}
      POSTGRES_USER: ${POSTGRES_LOAN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_LOAN_PASSWORD}
    ports:
      - "${POSTGRES_LOAN_PORT}:5432"
    volumes:
      - loan_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_LOAN_USER} -d ${POSTGRES_LOAN_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing_db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_BILLING_DB}
      POSTGRES_USER: ${POSTGRES_BILLING_USER}
      POSTGRES_PASSWORD: ${POSTGRES_BILLING_PASSWORD}
    ports:
      - "${POSTGRES_BILLING_PORT}:5432"
    volumes:
      - billing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BILLING_USER} -d ${POSTGRES_BILLING_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: fintech_rabbit
      RABBITMQ_DEFAULT_PASS: 12356789
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 3



volumes:
  loan_postgres_data:  
  billing_postgres_data: