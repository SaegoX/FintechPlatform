services:
  loan-service-api:
    image: fintech-loanservice:latest
    build:
      context: .
      dockerfile: LoanService.API/Dockerfile
    ports:
      - "7109:8080"
    environment:
      - ConnectionStrings__PostgresConnection=${LOAN_DB_CONNECTION_STRING}
      - ASPNETCORE_ENVIRONMENT=Development
      - BILLING_GRPC_URL=http://billing-service-api:5001
    depends_on:
      loan_db:
        condition: service_healthy

  billing-service-api:
    image: fintech-billingservice:latest
    build:
      context: .
      dockerfile: BillingService.API/Dockerfile
    ports:
      - "7110:8080"
      - "5001:5001"
    environment:
      - ConnectionString_BillingPostgresConnection=${BILLING_DB_CONNECTION_STRING}
      - RABBITMQ_CONNECTION=${RABBITMQ_CONNECTION}
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      billing_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  loan_db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_LOAN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_LOAN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_LOAN_DB}
    ports:
      - "${POSTGRES_LOAN_PORT}:5432"
    volumes:
      - loan_postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_LOAN_USER} -d ${POSTGRES_LOAN_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing_db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_BILLING_USER}
      POSTGRES_PASSWORD: ${POSTGRES_BILLING_PASSWORD}
      POSTGRES_DB: ${POSTGRES_BILLING_DB}
    ports:
      - "${POSTGRES_BILLING_PORT}:5432"
    volumes:
      - billing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BILLING_USER} -d ${POSTGRES_BILLING_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.2-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
 

volumes:
  loan_postgres_data:  
  billing_postgres_data: